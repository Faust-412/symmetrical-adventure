<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>КАЧОК 105</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #FFF8F0; color: #2D2D2D; min-height: 100vh; padding-bottom: 80px; }
        .header { background: linear-gradient(135deg, #FFA500 0%, #FF8C00); color: black; padding: 20px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 10px rgba(255, 140, 66, 0.3); }
        .header h1 { font-size: 24px; font-weight: 700; letter-spacing: 1px; color: black; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; }
        .screen { display: none; }
        .screen.active { display: block; }
        .muscle-grid { display: flex; flex-direction: column; gap: 15px; }
        .muscle-card { background: #1a1a1a; border-radius: 20px; padding: 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: all 0.3s ease; border: 2px solid transparent; min-height: 100px; }
        .muscle-card:active { transform: scale(0.98); border-color: #FF6B35; background: #2a2a2a; }
        .muscle-card-title { font-size: 40px; color: white; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-left: 50px; width: 50%; text-align: left; align-self: center; }
        .muscle-card-svg { width: 80px; height: 80px; object-fit: contain; }
        .muscle-card-img { height: 100%; max-height: 120px; width: auto; object-fit: contain; }
        .profile-section { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(255, 140, 66, 0.1); }
        .profile-section h3 { font-size: 18px; color: #FF6B35; margin-bottom: 15px; font-weight: 700; }
        .profile-form { display: flex; flex-direction: column; gap: 15px; }
        .profile-field { display: flex; flex-direction: column; gap: 8px; }
        .profile-field label { font-size: 14px; color: #666; font-weight: 600; }
        .profile-field input { width: 100%; padding: 15px; border: 2px solid #FFE5D0; border-radius: 12px; font-size: 18px; font-weight: 700; outline: none; background: #FFFAF5; text-align: center; }
        .profile-field input:focus { border-color: #FF8C42; }
        .gender-toggle { display: flex; background: #FFE5D0; border-radius: 12px; padding: 5px; }
        .gender-option { flex: 1; padding: 12px; text-align: center; border-radius: 8px; cursor: pointer; font-weight: 700; transition: all 0.3s; }
        .gender-option.active { background: #FF6B35; color: white; }
        .btn-save-profile { background: #FF6B35; color: white; font-size: 18px; font-weight: 900; padding: 15px; border-radius: 12px; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4); }
        .btn-save-profile:active { transform: scale(0.98); background: #E55A2B; }
        .progress-chart-container { position: relative; width: 100%; height: 450px; background: white; border-radius: 15px; padding: 15px; padding-bottom: 25px; overflow: visible; }
        .progress-chart { width: 100%; height: 350px; }
        .chart-value-display { text-align: center; padding: 15px; font-size: 16px; font-weight: 700; color: #FF6B35; min-height: 50px; }
        .chart-point { cursor: pointer; }
        .exercise-list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .exercise-list-header h2 { color: #FF6B35; font-size: 24px; font-weight: 700; }
        .exercise-item { background: white; border-radius: 15px; padding: 18px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-shadow: 0 2px 10px rgba(255, 140, 66, 0.1); transition: all 0.3s; }
        .exercise-item:active { background: #FFF0E8; }
        .exercise-item-info { flex: 1; }
        .exercise-item-name { font-size: 18px; font-weight: 700; color: #2D2D2D; margin-bottom: 5px; }
        .exercise-item-last { font-size: 14px; color: #666; }
        .exercise-item-arrow { width: 24px; height: 24px; fill: #FF6B35; }
        .btn-start-workout { background: #FF6B35; color: white; font-size: 20px; font-weight: 900; padding: 20px; text-align: center; border-radius: 15px; border: none; width: 100%; margin-top: 20px; box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4); cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .btn-start-workout:active { transform: scale(0.98); background: #E55A2B; }
        .exercise-detail-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #FFE5D0; padding-bottom: 10px; }
        .tab-btn { flex: 1; padding: 12px; background: none; border: none; font-size: 16px; font-weight: 700; color: #999; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s; }
        .tab-btn.active { color: #FF6B35; border-bottom-color: #FF6B35; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .info-text { font-size: 16px; line-height: 1.6; color: #2D2D2D; padding: 15px; background: white; border-radius: 15px; margin-bottom: 20px; }
        .history-item { background: white; border-radius: 12px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .history-date { font-weight: 600; color: #666; }
        .history-result { font-weight: 700; color: #FF6B35; }
        .history-delete-btn { background: none; border: none; font-size: 30px; cursor: pointer; padding: 5px; margin-left: 10px; opacity: 0.6; transition: all 0.2s; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
        .history-delete-btn:active { opacity: 1; transform: scale(0.9); }
        .confirm-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.8); display: none; justify-content: center; align-items: center; z-index: 4000; }
        .confirm-overlay.active { display: flex; }
        .confirm-dialog { background: white; border-radius: 20px; padding: 30px; text-align: center; max-width: 300px; width: 90%; }
        .confirm-message { font-size: 18px; font-weight: 700; color: #2D2D2D; margin-bottom: 25px; }
        .confirm-buttons { display: flex; gap: 15px; }
        .confirm-btn { flex: 1; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .confirm-btn-yes { background: #FF6B35; color: white; }
        .confirm-btn-no { background: #FFE5D0; color: #666; }
        .input-form { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(255, 140, 66, 0.1); }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 14px; color: #666; margin-bottom: 8px; font-weight: 600; }
        .input-group input { width: 100%; padding: 15px; border: 2px solid #FFE5D0; border-radius: 12px; font-size: 18px; font-weight: 700; outline: none; background: #FFFAF5; text-align: center; }
        .input-group input:focus { border-color: #FF8C42; }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 15px; font-size: 20px; font-weight: 900; cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-primary { background: #FF6B35; color: white; font-size: 22px; font-weight: 900; box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4); }
        .btn-primary:active { transform: scale(0.98); background: #E55A2B; }
        .back-btn { background: none; border: none; color: #FF6B35; font-size: 16px; font-weight: 700; cursor: pointer; padding: 10px 0; display: flex; align-items: center; gap: 5px; }
        .rest-timer-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.9); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 3000; }
        .rest-timer-overlay.active { display: flex; }
        .rest-timer-display { font-size: 80px; font-weight: 900; color: #FF6B35; margin-bottom: 30px; }
        .rest-timer-label { font-size: 24px; color: white; margin-bottom: 40px; font-weight: 700; }
        .btn-skip-rest { background: white; color: #FF6B35; font-size: 20px; font-weight: 900; padding: 20px 40px; border-radius: 15px; border: none; cursor: pointer; text-transform: uppercase; }
        .timer-choice-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.9); display: none; justify-content: center; align-items: center; flex-direction: column; z-index: 3001; }
        .timer-choice-overlay.active { display: flex; }
        .timer-choice-title { font-size: 24px; color: white; margin-bottom: 30px; font-weight: 700; text-align: center; }
        .timer-choice-buttons { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 300px; padding: 20px; }
        .btn-timer-choice { background: #FF6B35; color: white; font-size: 20px; font-weight: 900; padding: 20px; border-radius: 15px; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4); }
        .btn-timer-choice:active { transform: scale(0.98); background: #E55A2B; }
        .btn-timer-choice.secondary { background: white; color: #FF6B35; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 15px 0; box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.1); z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #999; cursor: pointer; padding: 5px 20px; transition: color 0.3s; }
        .nav-item.active { color: #FF6B35; }
        .nav-icon { width: 24px; height: 24px; fill: currentColor; }
        .stats-container { display: flex; flex-direction: column; gap: 20px; }
        .period-switcher { display: flex; background: white; border-radius: 15px; padding: 5px; margin-bottom: 20px; }
        .period-btn { flex: 1; padding: 12px; background: none; border: none; font-size: 14px; font-weight: 700; color: #999; cursor: pointer; border-radius: 10px; transition: all 0.3s; }
        .period-btn.active { background: #FF6B35; color: white; }
        .stats-summary { background: linear-gradient(135deg, #FF8C42 0%, #FF6B35); border-radius: 20px; padding: 25px; color: white; margin-bottom: 20px; }
        .stats-summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; text-align: center; }
        .stats-summary-item-value { font-size: 24px; font-weight: 900; margin-bottom: 5px; }
        .stats-summary-item-label { font-size: 12px; opacity: 0.9; }
        .muscle-bars { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .muscle-bars h3 { font-size: 18px; color: #FF6B35; margin-bottom: 15px; font-weight: 700; }
        .muscle-bar-item { margin-bottom: 15px; }
        .muscle-bar-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .muscle-bar-name { font-weight: 600; color: #2D2D2D; }
        .muscle-bar-percent { font-weight: 700; color: #FF6B35; }
        .muscle-bar-track { height: 12px; background: #FFE5D0; border-radius: 6px; overflow: hidden; }
        .muscle-bar-fill { height: 100%; background: #FF6B35; border-radius: 6px; transition: width 0.5s ease; }
        .chart-container { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        .chart-container h3 { font-size: 18px; color: #FF6B35; margin-bottom: 15px; font-weight: 700; text-align: center; }
        .pie-chart-wrapper { display: flex; flex-direction: column; align-items: center; }
        .chart-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 20px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        .legend-color { width: 16px; height: 16px; border-radius: 4px; }
        .workout-history { background: white; border-radius: 20px; padding: 20px; }
        .workout-history h3 { font-size: 18px; color: #FF6B35; margin-bottom: 15px; font-weight: 700; }
        .workout-date-header { font-size: 16px; font-weight: 700; color: #666; margin: 20px 0 10px; text-transform: capitalize; }
        .workout-card { background: #FFF8F0; border-radius: 15px; padding: 15px; margin-bottom: 10px; }
        .workout-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .workout-card-title { font-weight: 700; color: #2D2D2D; }
        .workout-card-stats { display: flex; gap: 20px; font-size: 14px; color: #666; }
        .workout-card-tonnage { font-weight: 700; color: #FF6B35; }
        .workout-comparison { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #FFE5D0; }
        .arrow-up { width: 20px; height: 20px; fill: #4CAF50; }
        .arrow-down { width: 20px; height: 20px; fill: #F44336; }
        .positive { color: #4CAF50; }
        .negative { color: #F44336; }
        .empty-state { text-align: center; padding: 40px 20px; color: #999; }
        .notification { position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #4CAF50; color: white; padding: 15px 30px; border-radius: 25px; font-weight: 700; box-shadow: 0 4px 20px rgba(76, 175, 80, 0.4); transition: transform 0.3s ease; z-index: 2000; }
        .notification.show { transform: translateX(-50%) translateY(0); }
        @media (max-width: 400px) { .header h1 { font-size: 20px; } .muscle-card-title { font-size: 20px; } .muscle-card-svg { width: 60px; height: 60px; } }
    </style>
</head>
<body>
    <div class="header"><h1>КАЧОК 105</h1></div>
    <div class="notification" id="notification">Данные сохранены!</div>
    <div class="timer-choice-overlay" id="timer-choice">
        <div class="timer-choice-title">Запустить таймер отдыха?</div>
        <div class="timer-choice-buttons">
            <button class="btn-timer-choice" onclick="startRestTimerFromChoice()">С таймером</button>
            <button class="btn-timer-choice secondary" onclick="saveWithoutTimer()">Без таймера</button>
        </div>
    </div>
    <div class="rest-timer-overlay" id="rest-timer">
        <div class="rest-timer-display" id="rest-timer-display">90</div>
        <div class="rest-timer-label">Отдых</div>
        <button class="btn-skip-rest" onclick="skipRest()">Пропустить</button>
    </div>
    <div class="confirm-overlay" id="confirm-overlay">
        <div class="confirm-dialog">
            <div class="confirm-message">Удалить эту запись?</div>
            <div class="confirm-buttons">
                <button class="confirm-btn confirm-btn-no" onclick="closeConfirmDialog()">Нет</button>
                <button class="confirm-btn confirm-btn-yes" onclick="confirmDelete()">Да</button>
            </div>
        </div>
    </div>
    <div class="container">
        <div id="home-screen" class="screen active">
            <div class="muscle-grid">
                <div class="muscle-card" onclick="showExercisesList('Грудь')">
                    <span class="muscle-card-title">ГРУДЬ</span>
                    <img class="muscle-card-img" src="chest.png" alt="Грудь">
                </div>
                <div class="muscle-card" onclick="showExercisesList('Спина')">
                    <span class="muscle-card-title">СПИНА</span>
                    <img class="muscle-card-img" src="back.png" alt="Спина">
                </div>
                <div class="muscle-card" onclick="showExercisesList('Руки')">
                    <span class="muscle-card-title">РУКИ</span>
                    <img class="muscle-card-img" src="arms.png" alt="Руки">
                </div>
                <div class="muscle-card" onclick="showExercisesList('Ноги')">
                    <span class="muscle-card-title">НОГИ</span>
                    <img class="muscle-card-img" src="legs.png" alt="Ноги">
                </div>
                <div class="muscle-card" onclick="showExercisesList('Плечи')">
                    <span class="muscle-card-title">ПЛЕЧИ</span>
                    <img class="muscle-card-img" src="shoulders.png" alt="Плечи">
                </div>
                <div class="muscle-card" onclick="showExercisesList('Пресс')">
                    <span class="muscle-card-title">ПРЕСС</span>
                    <img class="muscle-card-img" src="abs.png" alt="Пресс">
                </div>
            </div>
        </div>
        <div id="exercises-list-screen" class="screen">
            <button class="back-btn" onclick="showHome()"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Назад</button>
            <div class="exercise-list-header"><h2 id="current-muscle"></h2></div>
            <div id="exercises-list"></div>
            <button class="btn-start-workout" onclick="startWorkout()">НАЧАТЬ ТРЕНИРОВКУ</button>
        </div>
        <div id="exercise-detail-screen" class="screen">
            <button class="back-btn" onclick="showExercisesListFromDetail()"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Назад</button>
            <h2 id="exercise-detail-title" style="margin: 15px 0; color: #FF6B35; font-size: 24px; font-weight: 700;"></h2>
            <div class="exercise-detail-tabs">
                <button class="tab-btn active" onclick="switchTab('info')">Инфо</button>
                <button class="tab-btn" onclick="switchTab('history')">История</button>
                <button class="tab-btn" onclick="switchTab('progress')">Прогресс</button>
            </div>
            <div id="tab-info" class="tab-content active">
                <p class="info-text" id="exercise-info-text"></p>
                <div class="input-form" id="exercise-form-container"></div>
            </div>
            <div id="tab-history" class="tab-content"><div id="exercise-history-list"></div></div>
            <div id="tab-progress" class="tab-content">
                <div class="progress-chart-container" id="progress-chart-container">
                    <svg class="progress-chart" id="progress-chart"></svg>
                    <div class="chart-value-display" id="chart-value-display"></div>
                </div>
            </div>
        </div>
        <div id="stats-screen" class="screen">
            <div class="stats-container">
                <div class="period-switcher">
                    <button class="period-btn active" onclick="setPeriod('week')">1 неделя</button>
                    <button class="period-btn" onclick="setPeriod('2weeks')">2 недели</button>
                    <button class="period-btn" onclick="setPeriod('month')">Месяц</button>
                </div>
                <div class="stats-summary">
                    <div class="stats-summary-grid">
                        <div class="stats-summary-item"><div class="stats-summary-item-value" id="total-tonnage">0 т</div><div class="stats-summary-item-label">Тоннаж</div></div>
                        <div class="stats-summary-item"><div class="stats-summary-item-value" id="total-time">0 ч</div><div class="stats-summary-item-label">Время</div></div>
                        <div class="stats-summary-item"><div class="stats-summary-item-value" id="total-workouts">0</div><div class="stats-summary-item-label">Тренировки</div></div>
                    </div>
                </div>
                <div class="muscle-bars"><h3>НАГРУЗКА ПО ГРУППАМ МЫШЦ</h3><div id="muscle-bars-container"></div></div>
                <div class="chart-container">
                    <h3>РАСПРЕДЕЛЕНИЕ ТОННАЖА</h3>
                    <div class="pie-chart-wrapper">
                        <canvas id="pieChart" width="250" height="250"></canvas>
                        <div id="chart-legend" class="chart-legend"></div>
                    </div>
                </div>
                <div class="workout-history"><h3>ИСТОРИЯ ТРЕНИРОВОК</h3><div id="workout-history-list"></div></div>
            </div>
        </div>
        <div id="profile-screen" class="screen">
            <div class="profile-section">
                <h3>ПРОФИЛЬ</h3>
                <div class="profile-form">
                    <div class="profile-field">
                        <label>ПОЛ</label>
                        <div class="gender-toggle">
                            <div class="gender-option active" id="gender-male" onclick="setGender('male')">Мужчина</div>
                            <div class="gender-option" id="gender-female" onclick="setGender('female')">Женщина</div>
                        </div>
                    </div>
                    <div class="profile-field">
                        <label>ВОЗРАСТ (лет)</label>
                        <input type="number" id="profile-age" placeholder="25" min="1" max="100">
                    </div>
                    <div class="profile-field">
                        <label>РОСТ (см)</label>
                        <input type="number" id="profile-height" placeholder="175" min="100" max="250">
                    </div>
                    <div class="profile-field">
                        <label>ВЕС (кг)</label>
                        <input type="number" id="profile-weight" placeholder="80" min="30" max="200" step="0.1">
                    </div>
                    <button class="btn-save-profile" onclick="saveProfile()">СОХРАНИТЬ</button>
                </div>
            </div>
        </div>
    </div>
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTabNav('home')" id="nav-home">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Тренировка</span>
        </div>
        <div class="nav-item" onclick="switchTabNav('profile')" id="nav-profile">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Я</span>
        </div>
        <div class="nav-item" onclick="switchTabNav('stats')" id="nav-stats">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
            <span>Прогресс</span>
        </div>
    </nav>
    <script>
        const exercisesData = {
            'Руки': [

                if (data[deleteTarget.muscle].length === 0) delete data[deleteTarget.muscle];
            }
            if (Object.keys(data).length === 0) {
                localStorage.removeItem(key);
            } else {
                localStorage.setItem(key, JSON.stringify(data));
            }
            document.getElementById('confirm-overlay').classList.remove('active');
            loadExerciseHistory(currentExerciseName);
            loadProgressChart(currentExerciseName);
            deleteTarget = null;
        }
        document.addEventListener('DOMContentLoaded', function() { loadProfile(); });
    </script>
</body>
</html>
